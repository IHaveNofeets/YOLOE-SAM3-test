name: cv

services:
  batch-yoloe:
    build:
      context: ./dockers/batch-yoloe
      additional_contexts:
        wheels: ./wheels  # the Python packages, downloaded once (see the wheels service below)
    ports:
      - "7870:7870"
    volumes:
      - ./dockers/batch-yoloe/modelData/yoloe:/app/modelData/yoloe:rw
      - ./dockers/batch-yoloe/modelData/models:/app/models:rw
      # the labelled dataset (trainImages / testImages / refImages); only output/YOLOE/ is written to.
      # Point it elsewhere with DATASET_ROOT in a .env file next to compose.yaml.
      - ${DATASET_ROOT:-E:/Dataset}:/data:rw
    # fine-tuning's data loader workers share batches through /dev/shm (Docker's default 64 MB is too small)
    shm_size: "2gb"
    environment:
      - MAX_PARALLEL=8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7870/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    networks:
      - yoloe-net

  # the same dataset tool for SAM 3 (text, exemplar and visual prompts, prompt tuning), on port 7871.
  # sam3.pt is not downloaded (gated on Hugging Face): it is a copy in dockers/batch-sam3/modelData/sam3.
  batch-sam3:
    build:
      context: ./dockers/batch-sam3
      additional_contexts:
        wheels: ./wheels
    ports:
      - "7871:7871"
    volumes:
      - ./dockers/batch-sam3/modelData/sam3:/app/modelData/sam3:rw
      - ./dockers/batch-sam3/modelData/models:/app/models:rw
      # the labelled dataset; only output/SAM3/ is written to
      - ${DATASET_ROOT:-E:/Dataset}:/data:rw
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7871/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    networks:
      - yoloe-net

  # Fine-tuning YOLO26 (the plain YOLO, not YOLOE) on the same dataset, tested the same way, on port 7872.
  # The base weights (yolo26l-seg.pt etc.) are downloaded on first use into dockers/batch-yolo26/modelData/yolo26.
  batch-yolo26:
    build:
      context: ./dockers/batch-yolo26
      additional_contexts:
        wheels: ./wheels
    ports:
      - "7872:7872"
    volumes:
      - ./dockers/batch-yolo26/modelData/yolo26:/app/modelData/yolo26:rw
      - ./dockers/batch-yolo26/modelData/models:/app/models:rw
      # the labelled dataset; only output/YOLO26/ is written to
      - ${DATASET_ROOT:-E:/Dataset}:/data:rw
    # fine-tuning's data loader workers share batches through /dev/shm (Docker's default 64 MB is too small)
    shm_size: "2gb"
    environment:
      - MAX_PARALLEL=8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7872/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    networks:
      - yoloe-net

  # Not a server: downloads every Python package the images need into ./wheels, once, so building them
  # doesn't download anything again. Run it before building (only what's missing is downloaded):
  #   docker compose run --rm wheels     (with -f compose.yaml -f compose.gpu.yaml / compose.amd.yaml for a GPU)
  wheels:
    image: python:3.14-slim
    profiles: ["tools"]  # never started by "docker compose up"
    environment:
      - TORCH_VARIANT=cpu
    volumes:
      - ./wheels:/wheels:rw
      - ./dockers/batch-yoloe/requirements.txt:/src/batch-yoloe/requirements.txt:ro
      - ./dockers/batch-sam3/requirements.txt:/src/batch-sam3/requirements.txt:ro
      - ./dockers/batch-yolo26/requirements.txt:/src/batch-yolo26/requirements.txt:ro
      - ./tools/fetch_wheels.sh:/fetch_wheels.sh:ro
    command: ["sh", "/fetch_wheels.sh"]

networks:
  yoloe-net:
    driver: bridge
